[env:esp32dev]
; 6.9.0 => Arduino core 2.0.x (ESP8266Audio 1.9.7 builds against its I2S API)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    earlephilhower/ESP8266Audio@1.9.7
    adafruit/Adafruit PN532@1.3.4

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_compat_mode = off
